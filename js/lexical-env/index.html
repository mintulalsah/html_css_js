    <script>
   function outerFunction() {
  let outerVar = 'I am outer';

  function innerFunction() {
    let innerVar = 'I am inner';
    console.log('OuterVar in innerFunction:', outerVar); // Shows outerVar from outerFunction's Lexical Environment

  }

  innerFunction();
}

outerFunction();
